name: fetch-voices
on:
  push:
    branches: [claude/project-thread-7k63c7]
    paths: ['.github/workflows/fetch-voices.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/project-thread-7k63c7
          sparse-checkout: .github
      - run: |
          mkdir -p voces
          curl -fsSL -o voces/vo_surf.mp3 'https://elevenlabsusercontent.com/database/workspace/0cd299de1a284bdc9eef2184a266d132/content_generation/ed6yXg92P9zsOmN1bOYm/ftq3QeMgLbSDY6UKM9HU/content.mp3?Expires=1795770000&KeyName=assets-cdn-key-1&Signature=l8tUFCSRcYm19qk1Q1sD8v8BZzQ='
          ls -l voces
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add --sparse voces
          git commit -m "Voz surf"
          git push
