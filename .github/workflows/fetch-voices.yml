name: fetch-voices
on:
  push:
    branches: [claude/project-thread-7k63c7]
    paths: ['.github/workflows/fetch-voices.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/project-thread-7k63c7
          sparse-checkout: .github
      - run: |
          mkdir -p voces
          curl -fsSL -o voces/vo_futbol.mp3 'https://elevenlabsusercontent.com/database/workspace/0cd299de1a284bdc9eef2184a266d132/content_generation/ar6FI1kBH570UaAdUjZ6/kRaXH0QIyAYMxObUEMIa/content.mp3?Expires=1795737600&KeyName=assets-cdn-key-1&Signature=rYl5EZ7Zyhl3lhuJMQeKjIWT6RU='
          curl -fsSL -o voces/vo_escalada.mp3 'https://elevenlabsusercontent.com/database/workspace/0cd299de1a284bdc9eef2184a266d132/content_generation/BQH3qArvhERmrctSSYhV/ecxse8NfixoYl11DSbV2/content.mp3?Expires=1795737600&KeyName=assets-cdn-key-1&Signature=cPv3zXgc9jrWpB6md6omlHE1fUE='
          ls -l voces
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add --sparse voces
          git commit -m "Voces fútbol y escalada"
          git push
